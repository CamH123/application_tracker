services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: application_tracker
      POSTGRES_USER: application_tracker
      POSTGRES_PASSWORD: application_tracker
    ports:
      - "5433:5432"
    volumes:
      - application-tracker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  application-tracker-postgres:
