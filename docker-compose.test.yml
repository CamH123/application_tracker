services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: application_tracker_test
      POSTGRES_USER: application_tracker
      POSTGRES_PASSWORD: application_tracker
    ports:
      - "55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U application_tracker -d application_tracker_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 20
